name: volley_teams
description: "Volleyball team manager: players check in at the court and an organizer generates balanced teams."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.10.0
  equatable: ^2.0.7
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_timezone: ^4.1.0
  geolocator: ^14.0.3
  go_router: ^17.0.0
  google_sign_in: ^7.0.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0

flutter:
  uses-material-design: true
